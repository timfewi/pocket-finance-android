[package]
name = "tauri-plugin-receipt-capture"
version = "0.1.0"
edition = "2021"
license = "MIT"
links = "tauri-plugin-receipt-capture"
description = "Private Android receipt capture, import, and bundled on-device OCR"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri.workspace = true

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
