[package]
name = "pocket-finance-android"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "pocket_finance_android"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["wry", "protocol-asset"] }
tauri-plugin-receipt-capture = { path = "../plugins/receipt-capture" }
receipt-core = { path = "../crates/receipt-core" }
pocket-category-provider = "0.1.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
