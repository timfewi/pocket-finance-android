name: Public build checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust
        run: rustup show
      - name: Check public Rust crates
        run: |
          cargo test --locked -p receipt-core
          cargo test --manifest-path crates/category-provider/Cargo.toml --locked
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile and desktop receipt flows
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p receipt-core --example receipt_fixture_bridge
          target/debug/examples/receipt_fixture_bridge 8787 > "$RUNNER_TEMP/receipt-fixture-bridge.log" 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            -H 'Content-Type: application/json' \
            -d '{"command":"list_categories","args":{}}' \
            http://127.0.0.1:8787/invoke > /dev/null
          RECEIPT_BRIDGE_URL=http://127.0.0.1:8787 npm run test:e2e
