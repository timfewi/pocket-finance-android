[package]
name = "receipt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tiny_http = "0.12"
