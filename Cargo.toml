[workspace]
members = ["crates/receipt-core", "plugins/receipt-capture", "src-tauri"]
default-members = ["crates/receipt-core"]
exclude = ["crates/category-provider"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt", "sync"] }
tauri = { version = "=2.12.5", default-features = false }

[patch.crates-io]
pocket-category-provider = { path = "crates/category-provider" }
